<!DOCTYPE html>
<html lang="ru">
<head>
    <script>if(location.hostname==='lofilofi.pages.dev')location.replace('https://lofimusic.online'+location.pathname+location.search+location.hash);</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lofi Radio - Redirecting...</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <!-- Canonical указывает на основную страницу -->
    <link rel="canonical" href="https://lofimusic.online/ru/">
    <!-- hreflang для SEO -->
    <link rel="alternate" hreflang="ru" href="https://lofimusic.online/ru/">
    <link rel="alternate" hreflang="en" href="https://lofimusic.online/en/">
    <link rel="alternate" hreflang="x-default" href="https://lofimusic.online/ru/">
    <script>
        (() => {
            // Простая логика: если путь уже содержит /en/ или /ru/, не делаем редирект
            const path = window.location.pathname;
            if (
                path.startsWith('/en/') || path.startsWith('/ru/') ||
                path.startsWith('/en') || path.startsWith('/ru') ||
                path.startsWith('/privacy')
            ) {
                // Языковые страницы и политика — без редиректа на /ru/
                return;
            }

            // Определяем язык браузера только для корневого пути
            const browserLang = navigator.language.split('-')[0];
            const supportedLangs = ['ru', 'en'];
            const defaultLang = 'ru';

            // Проверяем, поддерживается ли язык браузера
            const lang = supportedLangs.includes(browserLang) ? browserLang : defaultLang;

            // Редирект на языковую версию
            window.location.href = `${lang}/`;
        })();
    </script>
    <meta http-equiv="refresh" content="0; url=ru/">
</head>
<body>
    <p>Redirecting to <a href="ru/">Russian version</a> or <a href="en/">English version</a>...</p>
</body>
</html>
